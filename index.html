<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#030304" />
  <meta name="color-scheme" content="only dark" />
  <meta name="darkreader-lock" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231c2436'/%3E%3Cpath d='M19 8v11a4 4 0 0 1-8 0' fill='none' stroke='%23e7ebf4' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E" />
  <title>Justo Darío Valverde Torres | Robotics Software Engineering Student</title>
  <!-- Before the first paint (src/state/theme.js): the visitor's choice, else the system's
       theme, else dark. -->
  <script>
    try {
      var stored = localStorage.getItem('theme')
      if (stored === 'light' || (!stored && matchMedia('(prefers-color-scheme: light)').matches)) {
        document.documentElement.dataset.theme = 'light'
        document.querySelector('meta[name="theme-color"]').content = '#e7ebf4'
        document.querySelector('meta[name="color-scheme"]').content = 'only light'
      }
    } catch (e) {}
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
